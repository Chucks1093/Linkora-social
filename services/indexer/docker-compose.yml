services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-linkora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-linkora}
      POSTGRES_DB: ${POSTGRES_DB:-linkora}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-linkora}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot container: applies all numbered migrations in filename order and
  # exits.  The indexer will not start until this service completes successfully,
  # ensuring the DB is never behind when the application boots.
  migrate:
    image: postgres:16-alpine
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations:ro
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-linkora}
    command: >
      sh -c "
        for f in \$(ls /migrations/*.sql | sort); do
          echo \"[migrate] applying \$$f\";
          psql -h postgres
               -U ${POSTGRES_USER:-linkora}
               -d ${POSTGRES_DB:-linkora}
               -v ON_ERROR_STOP=1
               -f \$$f
          || exit 1;
        done;
        echo '[migrate] all migrations applied'
      "

  indexer:
    build: .
    restart: unless-stopped
    stop_grace_period: 35s
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-linkora}:${POSTGRES_PASSWORD:-linkora}@postgres:5432/${POSTGRES_DB:-linkora}
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
